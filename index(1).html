<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library | Wishlist & Favorites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>📚 My Library</h1>
      <p>Discover books and save the ones you love.</p>
    </div>
    <span class="profile">Student</span>
  </header>

  <main class="container">
    <section class="intro">
      <div>
        <p class="eyebrow">YOUR PERSONAL COLLECTION</p>
        <h2>Wishlist & Favorite Books</h2>
        <p class="muted">Keep track of books you want to read and books you love.</p>
      </div>
      <button class="primary" id="addBookBtn">＋ Add a book</button>
    </section>

    <section class="stats">
      <article class="stat-card"><span>All saved books</span><strong id="totalCount">0</strong></article>
      <article class="stat-card"><span>Wishlist</span><strong id="wishlistCount">0</strong></article>
      <article class="stat-card"><span>Favorites</span><strong id="favoriteCount">0</strong></article>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Search by title, author or category..." aria-label="Search books">
      <select id="filterSelect" aria-label="Filter books">
        <option value="all">All saved books</option>
        <option value="wishlist">Wishlist</option>
        <option value="favorite">Favorites</option>
      </select>
    </section>

    <section id="bookGrid" class="book-grid" aria-live="polite"></section>
  </main>

  <dialog id="bookDialog">
    <form id="bookForm" method="dialog">
      <div class="dialog-heading">
        <h2>Add a book</h2>
        <button type="button" class="icon-button" id="closeDialog" aria-label="Close">✕</button>
      </div>
      <label>Book title<input id="bookTitle" required maxlength="100" placeholder="e.g. Atomic Habits"></label>
      <label>Author<input id="bookAuthor" required maxlength="80" placeholder="e.g. James Clear"></label>
      <label>Category<input id="bookCategory" maxlength="50" placeholder="e.g. Self-help"></label>
      <label>Cover image URL <span class="optional">(optional)</span><input id="bookImage" type="url" placeholder="https://example.com/book.jpg"></label>
      <label>Save to
        <select id="bookType">
          <option value="wishlist">Wishlist</option>
          <option value="favorite">Favorites</option>
        </select>
      </label>
      <p id="formError" class="error" role="alert"></p>
      <button class="primary submit-button" type="submit">Save book</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
